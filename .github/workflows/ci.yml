name: NBFC Data Engineering CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-data-quality:
    name: Python Data Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          python -m py_compile \
            python/data_generation/generate_nbfc_data.py \
            python/data_generation/validate_nbfc_data.py

      - name: Generate and validate synthetic data
        run: |
          TEMP_DATA_DIR="$(mktemp -d)"
          python python/data_generation/generate_nbfc_data.py "$TEMP_DATA_DIR"
          python python/data_generation/validate_nbfc_data.py "$TEMP_DATA_DIR"

  dbt-parse:
    name: dbt Parse
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dbt/nbfc_dbt

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt dependencies
        run: python -m pip install -r requirements.txt

      - name: Create temporary dbt profile
        run: |
          mkdir -p "$HOME/.dbt"
          cat > "$HOME/.dbt/profiles.yml" <<'EOF'
          nbfc_dbt:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ci_placeholder
                user: ci_placeholder
                password: ci_placeholder
                role: ACCOUNTADMIN
                database: NBFC_DW
                warehouse: CI_WAREHOUSE
                schema: CI
                threads: 1
          EOF

      - name: Parse dbt project
        run: dbt parse --target ci --no-partial-parse

  snowflake-qa-tests:
    name: Snowflake QA Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: dbt/nbfc_dbt
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/nbfc_ci_rsa_key.pem
      SNOWFLAKE_PRIVATE_KEY_SHA256: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_SHA256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt dependencies
        run: python -m pip install -r requirements.txt

      - name: Write temporary private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$SNOWFLAKE_PRIVATE_KEY_PATH"
          chmod 600 "$SNOWFLAKE_PRIVATE_KEY_PATH"

      - name: Verify temporary key integrity
        run: |
          ACTUAL="$(openssl rsa \
            -in "$SNOWFLAKE_PRIVATE_KEY_PATH" \
            -outform DER 2>/dev/null |
            openssl dgst -sha256 |
            awk '{print $NF}')"

          if [ "$ACTUAL" != "$SNOWFLAKE_PRIVATE_KEY_SHA256" ]; then
            echo "Private-key integrity check failed."
            exit 1
          fi

          echo "Private-key integrity check passed."

      - name: Create CI dbt profile
        run: |
          mkdir -p "$HOME/.dbt"
          cat > "$HOME/.dbt/profiles.yml" <<'PROFILE'
          nbfc_dbt:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                role: "{{ env_var('SNOWFLAKE_ROLE') }}"
                database: NBFC_DW
                warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
                schema: QA
                threads: 1
                private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
          PROFILE
          chmod 600 "$HOME/.dbt/profiles.yml"

      - name: Verify Snowflake connection
        run: dbt debug --profile nbfc_dbt --target ci

      - name: Run QA integration tests
        run: |
          dbt test --profile nbfc_dbt --target ci \
            --select qa_loan_application_consistency \
                      qa_child_loan_references \
                      qa_missing_loan_applications

      - name: Remove temporary private key
        if: always()
        run: rm -f "$SNOWFLAKE_PRIVATE_KEY_PATH"
